



{% load static %}

<!-- Modern Hero Section -->
<section class="hero-modern">
    <!-- Background Carousel -->
    <div id="heroCarousel" class="hero-carousel carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
        <div class="carousel-inner">
            <!-- Slide 1 -->
            <div class="carousel-item active">
                <img src="{% static 'images/Leafjpg.jpg' %}" class="d-block w-100" alt="Nature" loading="eager">
            </div>
            <!-- Slide 2 -->
            <div class="carousel-item">
                <img src="{% static 'images/Tree/IMG-20210803-WA0010.jpg' %}" class="d-block w-100" alt="Tree Plantation" loading="lazy">
            </div>
            <!-- Slide 3 -->
            <div class="carousel-item">
                <img src="{% static 'images/beach/beach1.jpeg' %}" class="d-block w-100" alt="Beach Cleaning" loading="lazy">
            </div>
        </div>
        
        <!-- Carousel Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    
    <!-- Hero Overlay -->
    <div class="hero-overlay"></div>
    
    <!-- Hero Content -->
    <div class="hero-content">
        <span class="subtitle">Welcome to</span>
        <h1>Earthmai <span>Foundation</span></h1>
        <p>Dedicated to environmental sustainability and community welfare. Together, we're creating a greener, cleaner future for generations to come.</p>
        <div class="hero-buttons">
            <a href="{% url 'about' %}" class="btn btn-modern btn-primary-modern">
                <i class="fas fa-leaf me-2"></i>Discover More
            </a>
            <a href="{% url 'donate' %}" class="btn btn-modern btn-secondary-modern" style="background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); color: white; border: 2px solid rgba(255,255,255,0.3);">
                <i class="fas fa-heart me-2"></i>Donate Now
            </a>
        </div>
    </div>
    
    <!-- Scroll Indicator -->
    <div class="hero-scroll-indicator">
        <i class="fas fa-chevron-down"></i>
    </div>
</section>
